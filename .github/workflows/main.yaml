name: "Main"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build-php:
    name: Build PHP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 and 8.5 are load-bearing for more than coverage: `MethodNameService` reads a
        # signature with `token_get_all()`, whose tokenisation changes between versions — 8.4
        # merges `private(set)` into one token, 8.5 merges `|>` and `(void)`. Those readings
        # are guarded so a manual renders the same whichever PHP renders it, and such a guard
        # can only fail on a version that produces the merged token.
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Install PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          php-extensions: ''
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: "locked"
      - name: "Lint PHP"
        run: find . -type f -name '*.php' ! -path "./.Build/*" ! -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l -n | (! grep -v "No syntax errors detected" )
      - name: "Run unit tests"
        run: make test-unit
      - name: "Run integration tests"
        run: make test-integration

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'
          php-extensions: ''
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: "locked"
      - name: "Check composer.json"
        run: "composer normalize --dry-run"
      - name: "Check code style"
        run: "make code-style"
      - name: "Run static code analysis"
        run: "make phpstan"
